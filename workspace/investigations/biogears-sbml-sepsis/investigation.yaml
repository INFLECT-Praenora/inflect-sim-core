at_a_glance:
  - {study: 00-simulation-core, role: "REPRESENT / start here — the one model, its engines, and the capabilities this investigation demonstrates."}
  - {study: 01-composition, role: "INTERCHANGEABILITY — which model properties survive an implementation swap (BioGears, Tellurium, surrogate); a common port layout does not guarantee equal physiology."}
  - {study: 02-ensembles, role: "EXPLORE — a severity × engine batch as one sweep, probing progression toward shock."}
  - {study: 03-workflows, role: "ORCHESTRATE — registered modules form a reproducible pipeline with no new integration code, handing an SBML file between engines and fanning the composite across a Nextflow severity grid."}
  - {study: 04-performance, role: "SCALE — where acceleration preserves useful predictions and where it fails; the stiff-ODE cost, the ~40,000× surrogate tier, the Rust (viva-core) backend, and COPASI as a second exact-SBML engine that reproduces Tellurium at ~4.7× the cost."}
  - {study: 05-fidelity, role: "EXPLAIN — the engines agree on the inflammation core to within ~0.1% and diverge in the hemodynamic layer; the discrepancy to investigate."}
  - {study: 06-cosimulation, role: "INTERVENE — physiology coupled to a treatment process every tick; untreated vs early vs delayed, with a coupling-step convergence test."}
  - {study: 07-evidence, role: "VALIDATE — the Workbench turning runs into traceable evidence with explicit pass / fail / pending acceptance criteria."}
  - {study: 08-reduced-model, role: "REDUCE — drop the per-beat event for a continuous mean-hemodynamics model: ~10^7x faster and engine-agnostic, at a stated fidelity cost (speed vs fidelity)."}

how_to_read: |
  How the simulation core works, in one idea: a simulation is a COMPOSITE — a small
  graph of PROCESSES and STEPS that read and write a shared, TYPED state. Each box in
  the graph declares typed input and output ports; the core wires the boxes together
  by matching ports to shared state paths and advances them in time. Because the
  interface is the ports — not the engine behind them — any engine that exposes the
  same observable ports is a drop-in. That is the whole trick: the BioGears sepsis
  core is ONE specification, and three different engines are each wrapped as a box
  over the same ports —
    - BioGearsProcess   — the original BioGears 8.2.0 C++ physiology engine;
    - TelluriumUTCStep  — the exact SBML/Antimony extraction, integrated by roadrunner (CVODE);
    - NeuralProcess     — a learned PyTorch surrogate of the same core.
  Swapping engines is swapping ONE box's address. The wiring, the emitters that record
  results, and the analysis are all unchanged. "Same spec, many engines" is not a
  slogan here — it is what the typed-port interface buys you (study 01).

  How the orchestration works, in four verbs: the unified workflow API exposes exactly
  this over HTTP, thinly — every call just builds and runs a composite.
    1. LIST modules       (GET /modules)              — the registered boxes you can use.
    2. RUN one module     (POST /modules/{name}/call) — run one box as a 1-node composite.
    3. CONNECT a workflow (POST /workflows)           — a composite spec: nodes (boxes) + wires.
    4. RUN the workflow   (POST /workflows/{id}/run)  — advance the composite, read the outputs.
  Study 03 is the running example: it connects modules into a pipeline and hands the
  Antimony/SBML extraction from one engine to another. Study 02 runs the engines as an
  ensemble; study 04 profiles where each spends compute. Full reference:
  docs/workflow-api.md and docs/api.md.

glossary:
  - term: "composite"
    definition: "A runnable simulation: a graph of processes/steps wired through a shared typed state. The core advances it in time."
  - term: "process / step"
    definition: "A box in the composite. A PROCESS advances one time interval per update (e.g. BioGears, the surrogate); a STEP runs once to completion (e.g. a full Tellurium time course, a math derivation). Both expose typed input/output ports."
  - term: "typed port interface"
    definition: "The named, typed inputs and outputs a box declares. Engines that expose the same ports are interchangeable — this is why one sepsis spec runs under three engines by swapping one box."
  - term: "module"
    definition: "A registered process/step, addressable by name (e.g. TelluriumUTCStep, NeuralProcess). Dozens are registered (this workspace lists 76 at GET /modules)."
  - term: "workflow"
    definition: "A composite built through the API: a list of nodes (modules) plus wires connecting one node's output port to another's input port."
  - term: "the four verbs"
    definition: "list a module, run one module, connect modules into a workflow, run the workflow — the entire workflow API surface (GET /modules, POST /modules/{name}/call, POST /workflows, POST /workflows/{id}/run)."
  - term: "ensemble"
    definition: "Running many configurations (here severity × engine) as one orchestrated batch and gathering their endpoints into a single comparison."
  - term: "surrogate"
    definition: "A learned neural approximation (viva-torch NeuralProcess) of an engine's per-step dynamics. Replaces the ODE solve with one forward pass: ~4-5 orders of magnitude faster, approximate."

biological_story: |
  Sepsis in BioGears is a race between an inflammatory response and the
  cardiovascular system that keeps blood pressure up. A bacterial load seeds the
  tissue; the Acute Inflammatory Response (McDaniel 2019) amplifies, tissue integrity
  falls, capillaries leak, and fluid moves from blood to interstitium. The heart and
  vasculature compensate — heart rate and vascular tone rise — until, in severe
  sepsis, that compensation fatigues and pressure falls toward septic shock.

  This is the model the simulation core runs under every engine. The inflammation half
  of the race the SBML extraction translates faithfully: run against the real engine,
  tissue integrity and pathogen load track it to within ~0.1% in both mild and
  severe infection. The cardiovascular half is where the engines part — BioGears
  carries a whole driven body (nutrition schedule, temperature, respiration, renal
  fluid handling, nitric-oxide and fever vasodilation, continuous baroreflex control),
  so even a controlled infection shows pressures wandering over ~10 mmHg, while the
  autonomous extraction holds those inputs at baseline and traces smooth. Same clinical
  outcome, different hemodynamic path to shock — the measured fidelity limit in study 05,
  which is why the capabilities here are shown on a model whose edges are stated, not hidden.
