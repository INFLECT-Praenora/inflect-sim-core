  - name: "Severe sepsis: all 9 observables, engine vs SBML over 48 h"
    address: image:charts/03_severe_9panel_engine_vs_sbml.svg
    display: primary
  - name: "CO–SVR phase portrait: same hypotension endpoint, opposite mechanism (orthogonal paths to the same iso-MAP contour)"
    address: image:charts/05_severe_phase_portrait_co_svr.svg
    display: mechanism
  - name: "Opposite shock mechanism over time: cardiac output and SVR as separate traces"
    address: image:charts/04_severe_mechanism_co_svr.svg
  - name: "Severe arm: SBP & HR overlay (the ~11 h hemodynamic lag)"
    address: image:charts/01_severe_sbp_hr_overlay.svg
  - name: "Inflammation core matches near bit-for-bit"
    address: image:charts/02_severe_inflammation_match.svg

baseline:
  - name: engine-severe
    composite: viva_biogears.composites.sepsis.biogears_sepsis
    config: {severity: 3}
    status: ran
    note: "Real BioGears 8.2.0 engine, severity 3, 48 h. SBP<100 at 26.6 h; tissue integrity min 0.325."

variants:
  - name: sbml-severe
    composite: viva_simulation_core.composites.sepsis_sbml.sepsis_sbml
    config: {severity: 3}
    status: ran
    note: "SBML extraction via viva-tellurium, severity 3, 48 h. SBP<100 at 37.5 h (~11 h late); tissue integrity min 0.325."

interventions: []
runs:
  - name: engine-vs-sbml-sev3
    status: completed
    canonical: true
    outcomes:
      severe-timing-divergence-quantified:
        result: passed
        detail: "SBP<100 engine 26.55 h vs SBML 37.47 h (10.9 h lag); HR>90 26.77 h vs 37.55 h — divergence quantified run-for-run (compare-sev3.json)."
        evidence_refs: [out/compare-sev3.json]
      severe-collapse-sequence-matches:
        result: partial
        detail: "Same qualitative collapse sequence on both sides, but a qualified match: the vasodilation mechanism diverges (SVR min 0.952 engine vs 0.715 SBML) and the timing lags ~11 h."
        evidence_refs: [out/compare-sev3.json]
    note: "Aligned comparison in out/compare-sev3.json; per-arm series + milestones in out/. Note: passed:false there is the EXPECTED result (the 5% numeric tolerance failing on hemodynamics is the finding); the parity gate that must pass is study 01 (baseline), which is test-backed."

conclusion_logic:
  if_primary_tests_fail:
    diagnose:
      - observation: >
          The severe arm reaches the same hypotension endpoint but by the opposite
          hemodynamic mechanism and ~11 h late (SVR min 0.952 engine vs 0.715 SBML;
          SBP<100 at 26.6 h vs 37.5 h) — a qualified, needs-calibration match rather
          than a mechanistic one.
        hypothesis: >
          The divergence is confined to the hemodynamic layer and maps to the
          vasomotor, fluid and metabolic subsystems the extraction omits or holds at
          baseline (inert nitric oxide, absent fever vasodilation, no renal/urine,
          no lactate) — so calibrating those pathways should close the gap.
        seeded_study: 05-divergence-mechanism

artifacts:
  - out/compare-sev3.json
  - out/engine-sev3.json
  - out/sbml-sev3.json
