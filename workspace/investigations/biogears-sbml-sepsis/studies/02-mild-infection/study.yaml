schema_version: 3
name: 02-mild-infection
investigation: biogears-sbml-sepsis
status: ran
title: "Mild infection (severity 1)"
confidence: Accepted

parent_studies:
  - {study: 01-baseline-parity, condition: tests-passed}

question: |
  Under a mild infection (severity 1), does the SBML extraction reproduce the
  BioGears engine's course — a controlled infection that resolves without
  progressing to hypotension — run for run?

hypothesis: |
  Both sides control the mild infection within ~24 h with SBP never falling below
  the healthy baseline and tissue integrity staying high; any divergence is small.

objective: |
  Run severity 1 on both the BioGears engine (viva-biogears) and the SBML
  extraction (viva-tellurium) over 48 h, align the 9 observables, and compare the
  milestone table (resolution time, SBP floor, tissue-integrity minimum).

expected_behavior:
  - name: mild-resolves-within-24h
    observable: "blood_pathogen, SBP, tissue_integrity"
    condition: "infection controlled within ~24 h; SBP never below the baseline; tissue integrity stays high (report: min ~0.97)"
    rationale: |
      Report milestone: mild (1e6) controlled within 24 h in both the paper and
      the Antimony model. This study confirms it run-for-run against the engine.

claim: |
  Under mild infection both the real engine and the SBML extraction keep the
  infection controlled over 48 h — neither crosses into hypotension (no SBP<100,
  no MAP<65, no HR>90) — and the inflammation core matches almost exactly
  (tissue integrity min 0.9676/0.9676, peak pathogen 6.298/6.298). Mild is the
  agreement case that frames the severe-arm divergence.

findings:
  - summary: "Mild infection stays controlled on both sides; no hypotension milestones crossed."
    detail: |
      Both arms, severity 1, 48 h, infection at t=0: SBP<100, MAP<65 and HR>90 are
      never reached (sustained) on either side. tissue_integrity minimum
      0.96755/0.96755; peak blood_pathogen 6.2983/6.2983 — near-identical.
      Hemodynamics differ modestly over the course (DBP ~5, MAP ~7.6, HR ~6.3 mmHg/bpm,
      blood_volume ~0.57 L), but the qualitative mild outcome agrees run-for-run.
    status: supported

baseline:
  - name: engine-mild
    composite: viva_biogears.composites.sepsis.biogears_sepsis
    config: {severity: 1}
    status: ran
    note: "Real BioGears 8.2.0 engine, severity 1, 48 h. Controlled; no hypotension."

variants:
  - name: sbml-mild
    composite: viva_simulation_core.composites.sepsis_sbml.make_sepsis_sbml_composite
    config: {severity: 1}
    status: ran
    note: "SBML extraction via viva-tellurium, severity 1, 48 h. Controlled; no hypotension."

interventions: []
runs:
  - name: engine-vs-sbml-sev1
    note: "Aligned comparison in out/compare-sev1.json; per-arm series + milestones in out/."

artifacts:
  - out/compare-sev1.json
  - out/engine-sev1.json
  - out/sbml-sev1.json
