schema_version: 3
name: 02-ensembles
investigation: biogears-sbml-sepsis
status: ran
title: "Simulation Ensembles — systematic perturbation and comparative physiology"
confidence: Accepted
# authored verdict — demonstration-level claim, backed by expected_behavior + runnable artifacts
verdict: supported  # severity x engine batch runs; full-physics engines agree and track severity

parent_studies:
  - study: 01-composition
    relation: builds-on
    rationale: "Ensembles sweep the interchangeable spec across severity and engine."

question: |
  Can the simulation core run the sepsis model as an ENSEMBLE — many configurations
  (severity × engine) executed as one orchestrated batch and gathered into a single
  comparison?

objective: |
  Demonstrate the ensembles pillar: run the sepsis core across severities {0,1,3}
  under multiple engines and gather one endpoint (minimum tissue integrity) into one
  grid — the same batch harness that would run any registered engine.

claim: |
  The sepsis core runs as a severity {0,1,3} × engine {BioGears, Tellurium, surrogate}
  ensemble, gathered into one grid. The two full-physics engines agree to within ~0.1% and
  show the expected severity response (minimum tissue integrity 1.00 healthy -> 0.97
  mild -> 0.24 severe); their heavy runs are cited from the committed severity studies.
  The surrogate ran live across every cell in the same batch — the orchestration proof
  that the harness executes many cheap configurations in one sweep — and is flagged a
  fast approximate tier (its endpoint is out of physical range; its real contribution,
  speed, is study 04).

expected_behavior:
  - name: severity-engine-batch-runs
    statement: "A severity {0,1,3} × engine batch is executed and gathered into one grid; the full-physics engines show the severity response and agree."
    status: supported
  - name: orchestration-runs-many-cheap
    statement: "The batch harness runs every cell; the surrogate sweeps all three severities live in seconds (the orchestration/speed tier)."
    status: supported

findings:
  - id: one-batch-severity-engine-the
    summary: "One batch, severity × engine — the full-physics engines show the severity response and agree."
    detail: |
      Minimum tissue integrity (the inflammation core) across severities {0,1,3}:
      BioGears and the exact Tellurium extraction both fall 1.00 (healthy) -> 0.968
      (mild) -> 0.243 (severe), to within ~0.1%. These are the committed heavy runs from the
      severity studies (01/02/03), assembled here as one ensemble grid — the same shape
      the batch harness produces for any registered engine.
    status: supported
  - id: the-surrogate-ran-live-across
    summary: "The surrogate ran live across every cell — the orchestration proof."
    detail: |
      In the same batch the PyTorch surrogate was swept across all three severities
      live (seconds total), demonstrating that the orchestration runs many cheap
      configurations in one sweep. The surrogate is a fast APPROXIMATE tier: its
      tissue-integrity endpoint is out of physical range (accuracy is data-limited),
      so it is reported for transparency but not presented as a science value. Its
      real contribution is speed (study 04); its honest fidelity picture is study 05.
    status: supported

    statement: The surrogate's divergence from the full-physics engines is a difference in tier, not a rival prediction. One batch answers a fidelity question and an orchestration question side by side.
    explanation: "The batch makes two different kinds of claim, and the apparent divergence sits entirely at the boundary between them. BioGears and the exact Tellurium extraction — two independently built full-physics engines — agree to within ~0.1% on minimum tissue integrity across severities {0,1,3} (1.00 healthy -> 0.968 mild -> 0.243 severe). Because they are separate implementations, that agreement is cross-engine replication: the severity response is a property of the shared model, not an artifact of one engine. That is the fidelity claim this study supports.\n\nThe surrogate is a different tier. Its tissue-integrity endpoint is out of physical range, so it is not a third physical estimate competing with the full-physics pair; reading it that way would be wrong. Its presence in every cell proves only what it is meant to: the harness orchestrates many cheap configurations in one sweep (the throughput claim, quantified in study 04). The divergence is by design, not an unresolved contradiction. The full-physics engines answer 'does the model show the expected, engine-independent severity response?' (yes); the surrogate answers 'can the batch harness fan a cheap engine across the whole grid live?' (yes). Neither bears on the other.\n\nThe open question the divergence makes visible is whether the surrogate can be moved from orchestration-proof to a science-grade tier at all. This grid cannot decide that; it needs a held-out quantitative fidelity test for the surrogate against the full-physics endpoints, which is the work deferred to study 05. Until that test exists, the surrogate's number stays reported for transparency and excluded from any fidelity claim."
