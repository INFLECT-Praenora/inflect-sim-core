  - name: engine-severe
    composite: viva_biogears.composites.sepsis.biogears_sepsis
    config: {severity: 3}
    status: ran
    note: "Real BioGears 8.2.0 engine, severity 3, 72 h. SBP<100 at 26.6 h; MAP<65 at 69.3 h; tissue integrity min 0.243."

variants:
  - name: sbml-severe
    composite: viva_simulation_core.composites.sepsis_sbml.sepsis_sbml
    config: {severity: 3}
    status: ran
    note: "SBML extraction via viva-tellurium, severity 3, 72 h. SBP<100 at 37.5 h (~11 h late); MAP<65 at 54.1 h (~15 h early); tissue integrity min 0.243."

interventions: []
runs:
  - name: engine-vs-sbml-sev3
    status: completed
    canonical: true
    outcomes:
      severe-timing-divergence-quantified:
        result: passed
        detail: "SBP<100 engine 26.55 h vs SBML 37.47 h (SBML +10.9 h); MAP<65 engine 69.33 h vs SBML 54.07 h (SBML −15.3 h — order flips); HR>90 26.77 h vs 37.55 h — divergence quantified run-for-run over 72 h (compare-sev3.json)."
        evidence_refs: [out/compare-sev3.json]
      severe-collapse-sequence-matches:
        result: partial
        detail: "Both arms reach MAP<65 shock within 72 h, but a qualified match: the vasodilation mechanism diverges (SVR ratio min 0.949 engine vs 0.646 SBML) and the milestone order flips (engine leads on SBP, SBML leads on MAP)."
        evidence_refs: [out/compare-sev3.json]
    note: "Aligned comparison in out/compare-sev3.json; per-arm series + milestones in out/. Note: passed:false there is the EXPECTED result (the 5% numeric tolerance failing on hemodynamics is the finding); the parity gate that must pass is study 01 (baseline), which is test-backed."

conclusion_logic:
  if_primary_tests_fail:
    diagnose:
      - observation: >
          Both arms reach MAP<65 shock within 72 h but by opposite hemodynamic
          mechanisms, and the milestone order flips (SVR ratio min 0.949 engine vs
          0.646 SBML; SBP<100 at 26.6 h engine vs 37.5 h SBML, but MAP<65 at 69.3 h
          engine vs 54.1 h SBML) — a qualified, needs-calibration match rather than
          a mechanistic one.
        hypothesis: >
          The divergence is confined to the hemodynamic layer and maps to the
          vasomotor, fluid and metabolic subsystems the extraction omits or holds at
          baseline (inert nitric oxide, absent fever vasodilation, no renal/urine,
          no lactate) — so calibrating those pathways should close the gap.
        seeded_study: 05-divergence-mechanism

artifacts:
  - out/compare-sev3.json
  - out/engine-sev3.json
  - out/sbml-sev3.json
