schema_version: 3
name: 00-simulation-core
investigation: biogears-sbml-sepsis
status: ran
title: "The simulation core — one sepsis model, every engine"
confidence: Accepted
# authored verdict — demonstration-level claim, backed by expected_behavior + runnable artifacts
verdict: supported  # all four capabilities demonstrated by runnable artifacts

parent_studies: []

question: |
  What can the simulation core do? This investigation takes ONE real model — the
  BioGears sepsis core — and shows four capabilities on it, each as something you
  can open and run, not a claim on a slide:
    1. COMPOSITION  — run the same spec under interchangeable engines (study 01).
    2. ENSEMBLES    — run a severity × engine batch in one orchestrated sweep (study 02).
    3. ORCHESTRATION / WORKFLOWS — compose modules into a pipeline and hand an
       Antimony/SBML file between engines (study 03).
    4. PERFORMANCE  — profile where the compute goes and how fast each engine is (study 04).
  A fidelity backbone (study 05) keeps it honest: where the engines agree, and where
  they do not.

objective: |
  Orient the reader. Name the one model, the engines it runs under, and the four
  capability studies — so the rest of the investigation reads as a guided tour of
  what the simulation core can do.

claim: |
  The simulation core runs one sepsis specification under three interchangeable
  engines: BioGears (C++ physiology), Tellurium (exact SBML via roadrunner/CVODE),
  and a PyTorch surrogate. It composes and orchestrates them into workflows (including
  passing an Antimony/SBML file between engines), runs them as ensembles, and does so
  performantly (seconds to hours across engines; a ~40,000× surrogate tier). Every
  capability below is a runnable artifact. The surrogate is a fast approximate tier —
  bounded, not yet clinically accurate — not a drop-in replacement.

expected_behavior:
  - name: one-spec-many-engines
    statement: "One sepsis specification runs under BioGears, Tellurium, and the PyTorch surrogate through one typed interface."
    status: supported
  - name: capabilities-are-runnable
    statement: "Each of the four capabilities (composition, ensembles, orchestration/workflows, performance) is demonstrated by an artifact that runs, not by assertion."
    status: supported

findings:
  - id: one-model-every-engine-the
    summary: "One model, every engine — the same sepsis spec runs under three interchangeable engines by swapping one box."
    detail: |
      The BioGears sepsis core is ONE specification. Each engine is a box over the
      same typed observable ports, so swapping engines is swapping one node address —
      the wiring, the emitters, and the analysis are unchanged:
        - BioGearsProcess — the original BioGears 8.2.0 C++ physiology engine;
        - TelluriumUTCStep / TelluriumProcess — the exact SBML/Antimony extraction, integrated by roadrunner (CVODE);
        - NeuralProcess — a learned PyTorch surrogate of the same core.
      This is the composition pillar; study 01 shows the three engines side by side.
    status: supported
    statement: Swapping engines means changing one typed node address. This shows the engines are interchangeable at the port boundary. It does not claim the three produce the same physiology.
    explanation: "This finding sets up the composition pillar the rest of the investigation stands on. The evidence is structural, not a single measured number. One sepsis spec exposes a fixed set of typed observable ports. Each engine sits as one node behind those ports: the BioGears 8.2.0 C++ physiology engine, the exact SBML/Antimony extraction integrated by roadrunner/CVODE (Tellurium), and the learned PyTorch surrogate. Moving between engines changes one node address; the wiring, emitters, and downstream analysis stay fixed.\n\nThe downstream artifacts show the swap is real. On the committed 72 h severe-arm run, study 01 records the inflammation core (tissue integrity, blood pathogen) overlapping to within ~0.1% between the two full-physics engines, and the surrogate completing a full 576-step rollout in a fraction of a second. Three independently built engines drive the same spec through the same ports. Study 02 varies severity x engine, study 03 hands an Antimony/SBML file between engines, and study 04 profiles each one.\n\nInterchangeable means drop-in at the typed port boundary, not numerically equal. Study 05 is qualified on exactly this line: the engines reach baseline parity and a near-identical inflammation core, but their hemodynamic layers differ in mechanism and timing. The surrogate makes this clearest. Study 04 records a ~40,000x full-run (~13,000x per-step) speedup over the stiff ODE solve, but that is a cost claim only; it works as a drop-in replacement only once the fidelity gate is met, and that number lives in study 05.\n\nLimitation: this finding has no numeric observed value, and should not. Its evidence is that the downstream studies exist and run, not a measured scalar. It is a demonstration-level claim about the artifacts, not a validation of their physiology. Two things stay open: the hemodynamic MAP/HR/SVR trajectories, where the two full-physics engines disagree in mechanism and timing, and the test that would settle them — a pre-registered discriminating test against an external hemodynamic reference. Study 05 bounds the divergence but cannot yet say which engine is right. Until that test exists, read this as an inventory of runnable, port-compatible capability over one spec, not as evidence that any engine reproduces real sepsis hemodynamics."
  - id: the-four-pillars-each-a
    summary: "The four pillars, each a runnable study."
    detail: |
      - COMPOSITION (study 01): the same spec under three engines, one node swapped.
      - ENSEMBLES (study 02): a severity × engine batch run as one orchestrated sweep.
      - ORCHESTRATION / WORKFLOWS (study 03): the four-verb API composes modules into a
        pipeline and hands an Antimony/SBML file between engines.
      - PERFORMANCE (study 04): where the compute goes (stiff ODE), and the surrogate's
        ~40,000× speedup.
      - FIDELITY (study 05): where the engines agree, and where they do not — so the
        demonstration stays credible.
    status: supported

    statement: The four capability pillars plus the fidelity backbone are each a study you can open and run, not a slide assertion. Together they map what the core can do, ordered so each study builds on the last. The map does not validate any pillar's physiology.
    explanation: "This finding is the investigation's map. Each capability the core claims is a study you can open and run, and the studies depend on one another in order. Composition (study 01) comes first: it sets up the one thing everything else reuses — the same sepsis spec behind one typed port boundary, with the engine as a single swappable node (the sibling finding on one-model-every-engine says the same). Ensembles (study 02) runs a severity x engine batch over that interchange. Workflows (study 03) hands an Antimony/SBML file between those engines through the four-verb API. Performance (study 04) profiles where the compute goes on the same spec, including the fast approximate surrogate tier. The pillars are one interchange shown four ways, so the order composition -> ensembles -> workflows -> performance is part of the claim, not just a list.\n\nThe fidelity backbone (study 05) sits outside that chain. It bounds all four and keeps 'each pillar runs' from being read as 'each pillar is physiologically correct'. The engines reach baseline parity and a near-identical inflammation core but diverge on the hemodynamic layer in mechanism and timing, which is why study 05's verdict is qualified, not supported. That qualification carries upward: the surrogate speedup in study 04 is a per-step compute result bounded by study 05's agreement envelope, and the ensemble and workflow pillars inherit the same ceiling. The map is only as strong as its weakest link, not as strong as the number of runnable studies.\n\nLimitation: this finding has no numeric observed value, and should not. Its evidence is structural — the five downstream studies exist and run — not a measured quantity. No single metric grades 'the core does all four'; the claim is checked study by study. Open question: there is no pre-registered discriminating test that would turn this map from 'four capabilities demonstrated over one spec' into 'four capabilities validated against an external reference', most sharply on the hemodynamic layer where study 05 records divergence but cannot yet say which engine is right. Until that test exists, read this as an inventory of runnable capability, not evidence that any pillar reproduces real sepsis physiology."
