schema_version: 3
name: 00-simulation-core
investigation: biogears-sbml-sepsis
status: ran
title: "The simulation core — one sepsis model, every engine"
confidence: Accepted
# authored verdict — demonstration-level claim, backed by expected_behavior + runnable artifacts
verdict: supported  # all four capabilities demonstrated by runnable artifacts

parent_studies: []

question: |
  What can the simulation core do? This investigation takes ONE real model — the
  BioGears sepsis core — and shows four capabilities on it, each as something you
  can open and run, not a claim on a slide:
    1. COMPOSITION  — run the same spec under interchangeable engines (study 01).
    2. ENSEMBLES    — run a severity × engine batch in one orchestrated sweep (study 02).
    3. ORCHESTRATION / WORKFLOWS — compose modules into a pipeline and hand an
       Antimony/SBML file between engines (study 03).
    4. PERFORMANCE  — profile where the compute goes and how fast each engine is (study 04).
  A fidelity backbone (study 05) keeps it honest: where the engines agree, and where
  they do not.

objective: |
  Orient the reader. Name the one model, the engines it runs under, and the four
  capability studies — so the rest of the investigation reads as a guided tour of
  what the simulation core can do.

claim: |
  The simulation core runs one sepsis specification under three interchangeable
  engines — BioGears (C++ physiology), Tellurium (exact SBML via roadrunner/CVODE),
  and a PyTorch surrogate — composes and orchestrates them into workflows (including
  passing an Antimony/SBML file between engines), runs them as ensembles, and does it
  performantly (seconds to hours across engines; a ~40,000× surrogate tier). Every
  capability below is a runnable artifact; the surrogate is a fast approximate tier
  (bounded, not yet clinically accurate), not a drop-in replacement.

expected_behavior:
  - name: one-spec-many-engines
    statement: "One sepsis specification runs under BioGears, Tellurium, and the PyTorch surrogate through one typed interface."
    status: supported
  - name: capabilities-are-runnable
    statement: "Each of the four capabilities (composition, ensembles, orchestration/workflows, performance) is demonstrated by an artifact that runs, not by assertion."
    status: supported

findings:
  - id: one-model-every-engine-the
    summary: "One model, every engine — the same sepsis spec runs under three interchangeable engines by swapping one box."
    detail: |
      The BioGears sepsis core is ONE specification. Each engine is a box over the
      same typed observable ports, so swapping engines is swapping one node address —
      the wiring, the emitters, and the analysis are unchanged:
        - BioGearsProcess — the original BioGears 8.2.0 C++ physiology engine;
        - TelluriumUTCStep / TelluriumProcess — the exact SBML/Antimony extraction, integrated by roadrunner (CVODE);
        - NeuralProcess — a learned PyTorch surrogate of the same core.
      This is the composition pillar; study 01 shows the three engines side by side.
    status: supported
    statement: Swapping engines is swapping one typed node address — a demonstrated engineering interchangeability at the port boundary, not a claim that the three engines produce equivalent physiology.
    explanation: "This finding establishes the composition pillar the rest of the investigation stands on, and its evidence is structural rather than a single measured quantity. One sepsis specification exposes a fixed set of typed observable ports, and each engine — the BioGears 8.2.0 C++ physiology engine, the exact SBML/Antimony extraction integrated by roadrunner/CVODE (Tellurium), and the learned PyTorch surrogate — sits as a single node behind those ports, so moving between engines changes one node address while the wiring, the emitters, and the downstream analysis stay fixed. That the swap is genuine and not asserted is what the downstream artifacts show: study 01 records the inflammation core (tissue integrity, blood pathogen) overlapping to within ~0.1% between the two full-physics engines on the committed 72 h severe-arm run, and the surrogate completing a full 576-step rollout in a fraction of a second — three independently implemented engines driving the same spec through the same ports. The severity x engine ensemble (study 02), the Antimony/SBML hand-off (study 03), and the per-engine profile (study 04) are all variations over this one interchange.\n\nThe interchangeability shown here is at the interface, not at the level of physiological output, and the two must not be conflated. Study 05's verdict is 'qualified' precisely on this line: the engines reach baseline parity and a near-identical inflammation core but their hemodynamic layers diverge in mechanism and timing. So 'interchangeable' means 'drop-in at the typed port boundary' — demonstrated by runnable artifacts — and not 'numerically equivalent', which study 05 shows is false on the hemodynamic layer. The surrogate makes the distinction sharpest: study 04 records a ~40,000x full-run (~13,000x per-step) speedup over the stiff ODE solve, but that is a statement about cost alone, usable as a drop-in only once the fidelity gate is met — the deciding number lives in study 05, not here.\n\nHonest limitation specific to this finding: it carries no numeric observed value, and by construction it should not. Its evidence is the existence and successful execution of the downstream studies, not a measured scalar, so it is demonstration-level — an existence-and-composition claim about the artifacts, not a validation of their physiology. Two unknowns remain explicitly open. The competing predictions the map does not adjudicate are the hemodynamic MAP/HR/SVR trajectories, where the two full-physics engines disagree in mechanism and timing. The proposed validator that would close them is a pre-registered discriminating test against an external hemodynamic reference — study 05 currently bounds the divergence descriptively but cannot yet say which engine is right. Until such a validator is added, this finding should be read as a faithful inventory of runnable, port-compatible capability over one spec, not as evidence that any single engine reproduces ground-truth sepsis hemodynamics."
  - id: the-four-pillars-each-a
    summary: "The four pillars, each a runnable study."
    detail: |
      - COMPOSITION (study 01): the same spec under three engines, one node swapped.
      - ENSEMBLES (study 02): a severity × engine batch run as one orchestrated sweep.
      - ORCHESTRATION / WORKFLOWS (study 03): the four-verb API composes modules into a
        pipeline and hands an Antimony/SBML file between engines.
      - PERFORMANCE (study 04): where the compute goes (stiff ODE), and the surrogate's
        ~40,000× speedup.
      - FIDELITY (study 05): where the engines agree, and where they do not — so the
        demonstration stays credible.
    status: supported

    statement: The four capability pillars plus the fidelity backbone are each an openable, runnable study rather than a slide assertion — a demonstrated map of what the core can do, ordered as an epistemic chain, not a validation that any one pillar's physiology is correct.
    explanation: "This finding is the investigation's map: it asserts that each capability the core claims is realised as a study you can open and run, and it fixes the order those studies depend on one another. Composition (study 01) comes first because it establishes the one precondition everything else reuses — the same sepsis spec behind one typed port boundary, with the engine as a single swappable node (the sibling finding on one-model-every-engine states exactly this). Ensembles (study 02) is then a severity x engine batch over that interchange; workflows (study 03) hands an Antimony/SBML file between those same engines through the four-verb API; and performance (study 04) profiles where the compute goes on the identical spec, including the fast approximate surrogate tier. Read top to bottom the pillars are not four independent demonstrations but one interchange elaborated four ways, which is why the ordering composition -> ensembles -> workflows -> performance is the claim, not just a list.\n\nThe fidelity backbone (study 05) is deliberately outside the capability chain: it is the honesty check that bounds all four. Its role here is to stop 'each pillar runs' from being misread as 'each pillar is physiologically correct'. The engines reach baseline parity and a near-identical inflammation core but diverge on the hemodynamic layer in mechanism and timing, which is why study 05's own verdict is qualified rather than supported. That qualification propagates upward: the surrogate speedup profiled in study 04 is a per-step compute result bounded by study 05's agreement envelope, and the ensemble and workflow pillars inherit the same ceiling. So the strength of this map is set by its weakest link, not by the count of runnable studies.\n\nHonest limitation specific to this finding: it carries no numeric observed value, and it should not be expected to. Its evidence is structural — the existence and successful execution of the five downstream studies — not a measured quantity, so it is demonstration-level by construction. There is no single aggregate metric that grades 'the core does all four'; the claim is verified study by study, and 'each a runnable study' is an existence-and-composition claim about the artifacts, not a validation of their physiology. Open question: the investigation has no pre-registered discriminating test that would convert this map from 'four capabilities demonstrated over one spec' into 'four capabilities validated against an external reference' — most sharply on the hemodynamic layer where study 05 records divergence but cannot yet say which engine is right. Until such a validator is added, this finding should be read as a faithful inventory of runnable capability, not as evidence that any pillar reproduces ground-truth sepsis physiology."
