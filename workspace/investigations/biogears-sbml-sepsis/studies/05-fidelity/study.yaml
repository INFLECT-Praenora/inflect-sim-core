  - name: sepsis-engine-vs-sbml
    composite: viva_simulation_core.composites.sepsis_sbml.sepsis_sbml
    config: {severity: 3}
    note: "The exact SBML extraction compared against the BioGears engine (both committed severe runs); the comparison that keeps the capabilities demonstration honest."

