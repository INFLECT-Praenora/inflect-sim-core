baseline:
  - name: sbml-sepsis-composite
    composite: viva_simulation_core.composites.sepsis_sbml.sepsis_sbml
    config: {severity: 0}
    status: ran
    note: |
      The registered SBML composite. The integrator benchmark loads the same
      underlying model (sources/biogears_sepsis.xml) directly through roadrunner so
      the solver can be swapped (cvode / rk45 / rk4) while everything else is held
      fixed; the composite is the investigation-level wrapper around that model.

variants: []
interventions: []

runs:
  - name: integrator-benchmark
    status: completed
    canonical: true
    note: |
      Analysis/benchmark study — no new sepsis simulation. Runs the real model under
      roadrunner's cvode / rk45 / rk4 integrators on a 60 s window, sweeps the RK4
      step, and extrapolates step counts to 48 h. Reproduce:
      .venv/bin/python workspace/investigations/biogears-sbml-sepsis/bench_integrators.py
      then make_integrator_figure.py.
    outcomes:
      sepsis-ode-is-stiff:
        result: passed
        detail: "rk4 non-finite for all dt >= 0.05 s; finite only at dt <= 0.02 s (8.6 M steps/48 h). out/integrator_bench.json (rk4[])."
        evidence_refs:
          - out/integrator_bench.json
          - ../../bench_integrators.py
      explicit-stays-wrong-at-tiny-steps:
        result: passed
        detail: "dt=0.001 s (173 M steps/48 h): 30/91 states >1% error, 5 >100%; worst PintVC 406 vs 1.58; slow states median 0.3%. per_state_dt001 + 01_integrator_stiffness."
        evidence_refs:
          - out/integrator_bench.json
          - charts/01_integrator_stiffness.svg
      integrator-reimpl-not-a-speed-lever:
        result: passed
        detail: "Working solver CVODE is compiled C (SUNDIALS); viva-hybrid trial measured Rust vs compiled numba at 2.01x (MARGINAL) on a non-stiff model."
        evidence_refs:
          - out/integrator_bench.json

