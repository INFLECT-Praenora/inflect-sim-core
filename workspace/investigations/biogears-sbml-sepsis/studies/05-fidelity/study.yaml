schema_version: 3
name: 05-fidelity
investigation: biogears-sbml-sepsis
status: ran
title: "Mechanistic Fidelity — agreement, discrepancy, and missing physiology"
confidence: Accepted
# authored verdict — demonstration-level claim, backed by expected_behavior + runnable artifacts
verdict: qualified  # inflammation core matches ~0.1%; honestly diverges on the hemodynamic layer

parent_studies:
  - study: 01-composition
    relation: tests
    rationale: "Fidelity tests whether the interchangeable engines actually agree; it finds the hemodynamic divergence."

question: |
  The capability studies show the same spec running under interchangeable engines.
  But do the engines actually agree, and where do they diverge? This is the honest
  backbone. The demonstration is credible only if the engines' limits are measured,
  not hidden.

objective: |
  Establish where the BioGears C++ engine and the exact SBML extraction agree
  (baseline, inflammation core) and where they diverge (the hemodynamic layer). Map
  each divergence to the BioGears subsystem the extraction omits, so the
  "same spec, many engines" claim is shown with its limits stated.

claim: |
  The engines agree where the extraction is faithful and diverge where it is not. At
  rest both hold the StandardMale baseline. Under infection the inflammation core
  (tissue integrity, blood pathogen) matches to within ~0.1% in both the mild and
  severe arms. They diverge in the hemodynamic layer. The engine fluctuates
  continuously (from its nutrition schedule and full homeostatic control) while the
  autonomous extraction is near-flat. Under severe sepsis both reach MAP<65 shock, but
  by opposite mechanisms and in flipped order: the engine by a hypodynamic low-output
  route (MAP<65 at 69.3 h), the extraction by a hyperdynamic vasodilatory route (MAP<65
  at 54.1 h) — ~15 h earlier, even though it lags ~11 h on systolic pressure. Every
  divergence maps to a vasomotor, fluid, or metabolic subsystem the extraction omits
  (nitric oxide, fever vasodilation, renal fluid handling, lactate, intracellular
  water). The surrogate is a further, coarser approximation (study 04): fast, bounded,
  not clinically accurate.

expected_behavior:
  - name: engines-agree-on-inflammation-diverge-on-hemodynamics
    statement: "Baseline and the inflammation core agree to within ~0.1%; the hemodynamic layer diverges in mechanism and timing, mapped to omitted subsystems."
    status: supported
  - name: event-free-reduction-tracks-the-full-model-within-one-engine
    statement: "Run under the same roadrunner engine, the event-free proto_valve reduction tracks the full model's filtered hemodynamics to well under 1 mmHg and its immune core to ~1e-9, with cardiac output and SVR as the stated ~6% cost of dropping the per-beat layer — so the event-free speedup is nearly fidelity-free on the slow observables."
    status: supported

findings:
  - id: where-they-agree-baseline-parity
    summary: "Where they agree — baseline parity and a near-identical (~0.1%) inflammation core."
    detail: |
      At rest both engines hold the StandardMale baseline within tolerance
      (00_baseline_parity). Under infection the inflammation observables match to ~0.1%
      in both the mild and severe arms (02_inflammation_match): tissue integrity (min
      0.243/0.243 severe) and blood pathogen (peak 330.2/330.6). The extracted Acute
      Inflammatory Response is a faithful translation of the engine's.
    status: supported
  - id: where-they-diverge-the-hemodynamic
    summary: "Where they diverge — the hemodynamic layer, in mechanism and timing."
    detail: |
      The divergence lives entirely in the hemodynamics (01_divergence_heatmap). The
      engine fluctuates continuously while the autonomous extraction is near-flat. Under
      severe sepsis the two reach MAP<65 shock by opposite routes and in flipped order
      (engine hypodynamic, MAP<65 at 69.3 h; extraction hyperdynamic, MAP<65 at 54.1 h).
      The functional-difference matrix (03_functional_difference_matrix) maps every
      divergence to the BioGears subsystem the extraction omits or leaves inert (nitric
      oxide, fever vasodilation, renal/urine, lactate, intracellular water).
    status: supported
  - id: event-free-reduction-is-near-fidelity-free-on-the-slow-observables
    summary: "Within one engine, the event-free proto_valve reduction tracks the full model to <0.7 mmHg on pressures, ~0.1 /min on HR, and ~1e-9 on the immune core, at a ~6% cost on CO/SVR (chart 04)."
    detail: |
      A separate fidelity axis from the engine-vs-engine comparison above: here both arms
      are the same roadrunner/CVODE engine, so any difference isolates the event-free
      structural change alone. Running the full sepsis_sbml model and the event-free
      proto_valve reduction (sources/proto_valve.xml) through the identical Composite
      harness (severity 3, 2 h, 10 s interval, this machine; study 04's
      run_proto_valve_compare.py -> proto_valve_compare.json) and taking the max absolute
      difference over the run: SBP 0.66 mmHg (0.58%), DBP 0.63, MAP 0.56, HR 0.098 /min
      (0.14%), blood volume 0.34 mL (6e-5 rel), and the immune core essentially exact —
      tissue integrity ~9e-11 and blood pathogen ~1e-8 relative. The cost of dropping the
      per-beat layer concentrates in two observables: cardiac output and SVR differ by
      ~6%, because the 5 s filters and the continuous beat phase replace the per-beat
      latched values. Instantaneous points are not meant to line up (the beat phase
      differs); on per-beat averages the prototype report measures the pressures within
      ~0.2 mmHg and the immune variables within ~1e-6. So the event-free reduction is
      near-fidelity-free on the slow sepsis observables and the mean hemodynamics, trading
      only the beat-resolved CO/SVR detail for its ~1.20x speed (study 04) — a much gentler
      trade than study 08's radical mean-hemodynamics surrogate, which drops pulsatility
      entirely for ~10^7x. This is measured within one engine, so it does not touch the
      engine-vs-engine divergence that is the rest of this study.
    status: supported

    statement: "The hemodynamic divergence is not transcription noise. It is two internally consistent, opposite shock trajectories: the engine reaches MAP<65 by a hypodynamic low-output route (69.3 h), the extraction by a hyperdynamic vasodilatory route (54.1 h). The ~15 h timing gap — earlier even though the extraction lags ~11 h on systolic pressure — and the engine's continuous fluctuation against the extraction's near-flat profile both point to the vasomotor, fluid, and metabolic subsystems the extraction omits, not to a faithfulness failure in the shared spec."
    explanation: "Agreement on the inflammation core to within ~0.1% (tissue integrity, blood pathogen) bounds the extraction's error to the hemodynamic layer. The acute inflammatory response is a faithful translation of the engine's; the closed-loop cardiovascular control is not. That turns the divergence into a testable disagreement. The two engines make different predictions about the same severe patient. The C++ engine predicts low-output shock: output falls and MAP<65 arrives later, at 69.3 h. The extraction predicts vasodilatory shock: peripheral resistance falls and MAP<65 arrives earlier, at 54.1 h, even though its systolic pressure trails by ~11 h. Both cannot be right about the real trajectory, so at least one route is an artifact of what the model carries, and every mapped divergence traces to a subsystem the extraction leaves out or inert (nitric oxide, fever vasodilation, renal/urine fluid handling, lactate, intracellular water).\n\nThis leaves one test open: trace the cardiac-output-versus-systemic-vascular-resistance split through the shock crossing across the severity sweep and compare it against the BioGears C++ reference. The engine whose output-vs-resistance partition matches the reference at MAP<65 is the faithful one; the other's shock route is the artifact. On the committed severe runs alone, this study measures that the engines diverge and maps each divergence to an omitted subsystem, but it does not yet settle which shock trajectory is correct. The study-04 surrogate is a further, coarser approximation on top of the extraction. The divergence is real and subsystem-localised; which of the two routes is right is still open."
