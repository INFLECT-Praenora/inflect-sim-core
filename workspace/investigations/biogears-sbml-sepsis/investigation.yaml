  - {study: 02-mild-infection, role: "Agreement case — mild infection controlled on both sides; also the first sign of the engine's ambient fluctuation."}
  - {study: 03-severe-infection, role: "Headline — the full 9-observable severe comparison: ~11 h lag and the opposite shock mechanism."}
  - {study: 04-engine-runtime, role: "Runtime axis (composition engine) — the SBML composite is bit-identical under process-bigraph (Python) and viva-core (Rust); engine swap moves only framework overhead."}
