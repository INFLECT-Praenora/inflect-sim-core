    composite: viva_simulation_core.composites.sepsis_sbml_eventfree_valve.sepsis_sbml_eventfree_valve
    config: {severity: 3}
    note: "The event-free proto_valve reduction (sources/proto_valve.xml) run under the SAME engine as the full model, to isolate the event-free structural change from the engine-vs-engine divergence. Tracks the full model to <0.7 mmHg / ~1e-9 immune, ~6% on CO/SVR (run_proto_valve_compare.py; chart 04)."
