schema_version: 3
name: 04-engine-runtime
investigation: biogears-sbml-sepsis
status: ran
title: "Engine runtime + cross-engine determinism"
confidence: Accepted

parent_studies:
  - {study: 01-baseline-parity, relation: supports}

question: |
  Does running the SBML sepsis composite on the Rust viva-core engine instead of
  the Python process-bigraph engine produce the same results, and how do their
  wall-clock times compare on this real physiology workload?

hypothesis: |
  viva-core reproduces process-bigraph's results bit-identically (its
  interchangeability claim), but for a composite built around one heavy
  libroadrunner process the engine swap mostly moves framework/tick overhead, so
  the wall-clock delta is modest — not viva-core's ~160x fine-grained figure.

objective: |
  Run the same serialized composite under process-bigraph (Python) and viva-core
  (Rust), confirm cross-engine determinism on the 9 observables, and record
  representative wall-clock for both — reporting the overhead honestly.

claim: |
  viva-core drives the real Tellurium/roadrunner process and reproduces
  process-bigraph bit-identically (max abs diff 0.0 across all 9 observables on
  warm runs). Wall-clock is essentially equal — a single heavy process means the
  engine swap measures framework overhead, not solver time (no ~160x here).

expected_behavior:
  - name: cross-engine-bit-identical
    observable: "the 9 sepsis observables, process-bigraph vs viva-core, warm runs"
    condition: "bit-identical (max abs difference 0.0)"
    rationale: |
      viva-core is byte-compatible with process-bigraph and runs the same
      roadrunner computation through an adapter that does not alter it. Verified
      by tests/test_cross_engine.py.
  - name: runtime-overhead-only
    observable: "wall-clock, both engines, matched horizon/interval"
    condition: "within ~10% — framework overhead, not a solver speedup"
    rationale: |
      One heavy libroadrunner process dominates compute; the tick loop is a small
      fraction, so the engine choice barely moves total time. Fine-grained
      decomposition is where viva-core's speedup would appear.

findings:
  - summary: "viva-core drives the real Tellurium process and matches process-bigraph bit-identically."
    detail: |
      viva_core.run drives the real TelluriumProcess via a thin adapter
      (viva_simulation_core/analysis/vc_adapter.py) that works around current
      viva-core MVP limits (stock address, core injection, empty containers,
      map-store overwrites) WITHOUT changing the roadrunner computation. On warm
      runs the final state is bit-identical to process-bigraph across all 9
      observables (max abs diff 0.0). A fresh-process first roadrunner run differs
      by ~1e-6 relative (a Python-side cold-start effect), so the cold tolerance
      is rtol=1e-5.
    status: supported
  - summary: "Wall-clock is framework overhead, not a speedup, for this single-heavy-process composite."
    detail: |
      severity 0, 10 s interval, one measurement each (600 s / 3600 s are
      simulated time): 600 s -> process-bigraph 25.3 s, viva-core 25.9 s;
      3600 s -> process-bigraph 139.9 s, viva-core 125.8 s. Essentially equal, as
      predicted: the libroadrunner solver dominates and the tick loop is a small
      slice. These single measurements are indicative, not benchmarked.
    status: supported
  - summary: "The SBML extraction runs a matched 48 h sim modestly faster than the real engine (1.2-1.6x), not orders of magnitude."
    detail: |
      Committed wall-clock (meta.wall_s) for one matched 48 h simulation: mild —
      real BioGears engine 3.35 h vs SBML extraction 2.15 h (1.56x); severe — engine
      3.38 h vs SBML 2.81 h (1.20x). The extraction is modestly faster, not an order
      of magnitude, because integrating the stiff 91-state ODE in roadrunner is
      itself heavy (study 06). This is the model-vs-model axis relevant to large
      virtual-patient sweeps — distinct from the composition-engine swap above
      (process-bigraph vs viva-core), which is bit-identical and overhead-only.
    status: supported

visualizations:
  - name: "Cross-engine runtime: process-bigraph (Python) vs viva-core (Rust) — bit-identical, overhead-only"
    address: image:charts/01_runtime_bars.svg
    display: primary
  - name: "Model-vs-model 48 h wall-clock: real engine vs SBML extraction (SBML modestly faster)"
    address: image:charts/02_model_runtime_48h.svg
    display: mechanism

baseline:
  - name: sbml-under-process-bigraph
    composite: viva_simulation_core.composites.sepsis_sbml.sepsis_sbml
    config: {severity: 0}
    note: "Same composite run on the Python process-bigraph engine."

variants:
  - name: sbml-under-viva-core
    composite: viva_simulation_core.composites.sepsis_sbml.sepsis_sbml
    config: {severity: 0}
    note: "Same serialized .pbg document run on the Rust viva-core engine via vc_adapter."

interventions: []
runs:
  - name: cross-engine-sev0
    status: completed
    canonical: true
    outcomes:
      cross-engine-bit-identical:
        result: passed
        detail: "viva-core vs process-bigraph, warm runs: max abs diff 0.0 across all 9 observables (severity 0 and 1); tests/test_cross_engine.py."
      runtime-overhead-only:
        result: passed
        detail: "Wall-clock within ~10% (600 s: 25.3/25.9 s; 3600 s: 139.9/125.8 s) — framework overhead, no solver speedup, as predicted for a single heavy process."
