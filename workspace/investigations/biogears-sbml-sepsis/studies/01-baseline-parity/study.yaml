schema_version: 3
name: 01-baseline-parity
investigation: biogears-sbml-sepsis
status: ran
title: "Baseline parity"
confidence: Accepted

question: |
  At rest (no infection), do the real BioGears engine and the SBML/Antimony
  extraction settle to the same StandardMale baseline haemodynamics, so that any
  later divergence under infection is attributable to the model and not to a
  mismatched starting state?

hypothesis: |
  Both sides hold the stabilised StandardMale baseline — SBP/DBP ~114/73.5 mmHg,
  HR ~72 /min, cardiac output ~5.9 L/min — within a small tolerance, because the
  extraction ships at BioGears' own stabilised healthy state.

objective: |
  Run both the BioGears engine (viva-biogears biogears_sepsis) and the SBML
  extraction (viva-tellurium) at severity 0 and compare the baseline observables
  on a common clock. This study is the gate for studies 02 and 03: if the
  baselines do not match, measured infection divergence is not trustworthy.

claim: |
  Both sides hold the BioGears StandardMale baseline and match each other at rest:
  real engine SBP 114.9 / DBP 74.5 / HR 72.2 / CO 5.81 L/min vs SBML extraction
  SBP 114.6 / DBP 73.5 / HR 71.5 / CO 5.9 L/min — all within physiological
  tolerance. The run-for-run parity gate PASSES; infection divergence measured in
  studies 02/03 is attributable to the model, not a mismatched starting state.

expected_behavior:
  - name: sbml-baseline-matches-biogears-targets
    observable: "SBP, DBP, HR, cardiac output at severity 0"
    condition: "within tolerance of StandardMale targets (SBP 114, DBP 73.5, HR 72, CO 5.9 L/min)"
    rationale: |
      The extraction ships at BioGears' stabilised healthy state; a short
      severity-0 run must stay at that baseline. Verified by
      tests/test_sepsis_sbml.py::test_sbml_loads_and_steps.
  - name: engine-baseline-matches-targets
    observable: "same baseline observables from the real BioGears engine"
    condition: "within tolerance of the same StandardMale targets"
    rationale: |
      PASSED on the locally-built BioGears 8.2.0 engine: SBP 114.87, DBP 74.54,
      HR 72.24, CO 5.81 L/min at severity 0 (5 min rest). Verified by
      tests/test_sepsis_engine.py::test_engine_baseline_parity.

visualizations:
  - name: "Baseline parity at rest: engine vs SBML vs StandardMale target"
    address: image:charts/01_baseline_parity.svg
    display: primary

baseline:
  - name: engine-rest
    composite: viva_biogears.composites.sepsis.biogears_sepsis
    config: {severity: 0}
    status: ran
    note: "Real BioGears 8.2.0 engine at rest (built locally). Baseline SBP 114.87 / DBP 74.54 / HR 72.24 / CO 5.81 L/min."

variants:
  - name: sbml-extraction-rest
    composite: viva_simulation_core.composites.sepsis_sbml.sepsis_sbml
    config: {severity: 0}
    note: "SBML extraction via viva-tellurium. Baseline recorded in findings."

interventions: []

findings:
  - summary: "Engine and SBML baselines match at rest — run-for-run parity holds."
    detail: |
      Real BioGears 8.2.0 (severity 0, 5 min): SBP 114.87, DBP 74.54, HR 72.24,
      CO 5.81 L/min. SBML extraction (severity 0, 30 s): SBP 114.6, DBP 73.48,
      HR 71.5, CO 5.905 L/min. Max difference ~1 mmHg / ~0.7 bpm / ~0.1 L/min —
      well within physiological tolerance. Both read uninfected (blood_pathogen ~0,
      tissue_integrity ~1.0). The parity gate PASSES, so divergence under
      infection (studies 02/03) reflects the model, not the starting state.
    status: supported

runs:
  - name: baseline-parity-check
    status: completed
    canonical: true
    outcomes:
      sbml-baseline-matches-biogears-targets:
        result: passed
        detail: "SBML severity-0 baseline (SBP 114.6 / DBP 73.48 / HR 71.5 / CO 5.905 L/min) within tolerance of the StandardMale targets; tests/test_sepsis_sbml.py."
      engine-baseline-matches-targets:
        result: passed
        detail: "Real BioGears 8.2.0 severity-0 baseline (SBP 114.87 / DBP 74.54 / HR 72.24 / CO 5.81 L/min) within tolerance; tests/test_sepsis_engine.py."

artifacts:
  - charts/01_baseline_parity.svg
  - out/baseline.json
