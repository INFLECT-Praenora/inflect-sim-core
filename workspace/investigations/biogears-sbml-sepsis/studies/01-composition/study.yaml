schema_version: 3
name: 01-composition
investigation: biogears-sbml-sepsis
status: ran
title: "Composition — one sepsis spec, interchangeable engines"
confidence: Accepted
# authored verdict — demonstration-level claim, backed by expected_behavior + runnable artifacts
verdict: supported  # one spec runs under three interchangeable engines (live check + overlay)

parent_studies: []

question: |
  Does the same sepsis specification run under interchangeable engines by swapping
  one box — BioGears (C++ physiology), the exact SBML extraction (Tellurium/CVODE),
  and a PyTorch surrogate — all through one typed-port interface?

objective: |
  Demonstrate the composition pillar: the BioGears sepsis core is ONE spec; each
  engine is a box over the same observable ports, so swapping engines is swapping one
  node address while the wiring, emitters, and analysis stay unchanged.

claim: |
  The same sepsis core runs under three interchangeable engines — BioGears (C++),
  Tellurium (exact SBML via roadrunner/CVODE), and a PyTorch surrogate — each a box
  over the same typed observable ports. Swapping engines is swapping one box's
  address. The nine-observable overlay shows the two full-physics engines (BioGears
  and exact Tellurium) run the same spec and track to within ~0.1% on the inflammation
  core; the surrogate is the third interchangeable engine (its speed and approximate
  behavior are study 04). Where the full-physics engines diverge — the hemodynamic
  layer — is the fidelity backbone (study 05).

expected_behavior:
  - name: same-spec-three-engines
    statement: "The one sepsis spec produces a trajectory under each of BioGears, exact Tellurium, and the PyTorch surrogate, through one typed interface."
    status: supported
  - name: swap-is-one-node
    statement: "Switching engine changes only one node's address; the composite wiring, emitters, and analysis are unchanged."
    status: supported

findings:
  - id: one-sepsis-spec-two-full
    summary: "One sepsis spec, two full-physics engines overlaid on nine observables — same spec, one box swapped."
    detail: |
      The same BioGears sepsis core specification runs under the BioGears 8.2.0 C++
      engine and under the exact SBML/Antimony extraction (Tellurium/roadrunner,
      CVODE). Across all nine shared observables the inflammation core (tissue
      integrity, blood pathogen) overlaps to within ~0.1%; the hemodynamic observables
      diverge (studied in 05). Because each engine is a box over the same typed
      observable ports, the swap is a single node-address change — nothing else in
      the composite moves.
    status: supported
    statement: "The same sepsis spec runs under interchangeable engines. The two full-physics engines agree on the inflammation core — that is the composition proof. They diverge on the hemodynamic layer, which study 05 is set up to settle. The surrogate is interchangeable at the interface; its accuracy is deferred to study 04."
    explanation: "Agreement and divergence here mean different things, and both matter. On the committed 72 h severe-arm run, the inflammation core — tissue integrity and blood pathogen — overlaps to within ~0.1% between the BioGears 8.2.0 C++ engine and the exact SBML/Antimony extraction integrated by Tellurium/roadrunner (CVODE). Two independently built full-physics engines reproduce the same spec through the same typed observable ports. That overlap is the composition proof: swapping the engine changes one node's address and nothing else in the composite — wiring, emitters, and analysis are untouched (report-card axes tellurium_builds and surrogate_runs are both within_tol over the real 91-state model).\n\nThe PyTorch surrogate is interchangeable in the same structural way. It constructs over that 91-state model and completes a full 576-step rollout in 0.198 s (engines_live_check.json). But that is interchangeability of interface, not accuracy; its output is bounded yet out of range, which is why its claim is speed (study 04), not fidelity.\n\nThe two full-physics engines diverge on the hemodynamic layer. That divergence is not a flaw in the composition; it is the signal this study hands downstream. The open question is which engine's MAP/HR/SVR trajectories to trust, and study 05 is set up to settle it. This is the first link of the chain the investigation builds on: composition shows one spec runs under swappable engines, which ensembles (02) vary, workflows (03) orchestrate, performance (04) times, and fidelity (05) judges. Honest limit: the ~0.1% figure is an authored reading of a single committed severe-arm run reused from study 03, not a seed ensemble and not a code-graded band, so it demonstrates that the engines agree on the inflammation core rather than giving a calibrated error bound."
  - id: the-surrogate-is-the-third
    summary: "The surrogate is the third interchangeable engine — it constructs and runs live here."
    detail: |
      The PyTorch surrogate (viva-torch NeuralProcess) is the same sepsis core as a
      learned box over the same ports. The live check (engines_live_check.json)
      confirms it: the Tellurium/roadrunner engine constructs over the real 91-state
      model, and the surrogate runs a full 48 h / 576-step rollout in a fraction of a
      second, finite (though out of physical range — it is degenerate across severity).
      It is a fast APPROXIMATE tier — not asserted
      clinically accurate (its speed is study 04; the honest accuracy picture is 05).
    status: supported

    statement: 'The PyTorch surrogate is the third interchangeable engine at the interface. It constructs over the same 91-state sepsis spec and completes a full 48 h / 576-step rollout live (0.198 s, finite but out of physical range). Swapping to it is one node-address change, like swapping BioGears for exact Tellurium. That is interchangeability of interface; speed is deferred to study 04 and accuracy to study 05.'
    explanation: "This finding shows interchangeability of interface, not accuracy, and the honest work is saying which. In the live check (engines_live_check.json) the Tellurium/roadrunner engine constructs over the real 91-state SBML extraction, and the PyTorch surrogate (viva-torch NeuralProcess) completes a full 48 h / 576-step rollout in 0.198 s with finite output. The learned box plugs into the same typed observable ports as the two full-physics engines and runs end to end on the one spec. That is the third leg of the composition claim: swapping to the surrogate changes one node's address and nothing else in the composite — wiring, emitters, and analysis are untouched — just like swapping between BioGears and exact Tellurium.\n\nBut the surrogate's output, while bounded and finite over the horizon, is out of physical range and degenerate across severity. So the check shows the learned box fits the socket, not that it reproduces the physiology. Its two numeric claims are deferred by design: its speed (the 0.198 s rollout) is study 04, and whether its trajectories can be trusted at all is study 05. In the chain, this finding gives performance (04) and fidelity (05) a surrogate to time and to judge: composition shows a learned engine is swappable at the interface, and the downstream studies decide what that swap costs. Honest limit: interchangeable here is a structural existence claim backed by a single live construction-and-rollout check, not a graded accuracy band. The surrogate is known to be out of physical range, so no fidelity or clinical-accuracy claim is made."
