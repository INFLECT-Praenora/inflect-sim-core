schema_version: 2
name: simulation-core
created: "2026-11-16"
plugin_version: 0.4.16
package_path: viva_simulation_core

# Runtime config. Force the reliable per-step SQLite emitter. The framework
# default emitter (xarray/zarr) under-fills its size-3 async buffer
# non-deterministically for these interval-chunked SBML runs, so the recorded
# history comes back shorter than the executed ticks and run_runner rejects the
# run as "run truncated" — nothing lands in studies/<slug>/runs.db, which is why
# every sepsis study showed an empty Simulations tab. SQLite records every tick
# durably, so runs are actually recorded.
runtime:
  default_emitter: sqlite

# Imported modules this workspace integrates. The optional simulation-engine
# wrappers are declared here so the catalog (Repositories tab) shows every engine
# the workspace imports, not only the ones the ecosystem registry happens to know.
# They are `mode: reference`: declared for visibility, loaded lazily on demand
# (viva_simulation_core.engines) and registered by process-bigraph auto-discovery,
# NOT eagerly chained into build_core() — so a bare install with no engines still
# works. The set is enforced to match pyproject's engine extras by
# tests/test_engine_imports_declared.py. Keep sources in sync with
# [project.optional-dependencies] in pyproject.toml.
imports:
  viva-tellurium:
    source: "git+https://github.com/vivarium-collective/viva-tellurium"
    ref: "2d07d068bb4dd713c9ed61f59747d21b49498cc2"
    mode: reference
    description: "Tellurium / roadrunner engine — exact SBML (CVODE). Optional extra: tellurium."
  viva-copasi:
    source: "git+https://github.com/vivarium-collective/viva-copasi.git"
    ref: "937ff132f2e8c755248a38a7440067f8d1871001"
    mode: reference
    description: "COPASI engine (basico) — exact SBML. Optional extra: copasi."
  viva-biogears:
    source: "git+https://github.com/vivarium-collective/viva-biogears"
    ref: "8d0201976b2b3a008bc6406fdfe3f980d9bcb77f"
    mode: reference
    description: "BioGears 8.2.0 C++ whole-body physiology engine. Optional extra: biogears."
  viva-torch:
    source: "git+https://github.com/vivarium-collective/viva-torch"
    ref: "bf1ebcca8bfa9f83b8d79ae0b4438a75376b59b5"
    mode: reference
    description: "PyTorch learned surrogate engine. Optional extra: surrogate."
  viva-core:
    source: "git+https://github.com/vivarium-collective/viva-core"
    ref: "154d94c2f30050715e87aa89af2b93b04d5f77b7"
    mode: reference
    description: "Rust (viva-core) execution backend. Optional extra: rust."
  viva-impulse:
    source: "git+https://github.com/vivarium-collective/viva-impulse"
    ref: "dfc6c86d85d7aba746b256ad4296ef3f0005b972"
    mode: reference
    description: "Hybrid continuous + discrete-event simulator (events as first-class Steps). Powers the sepsis_hybrid composite. Optional extra: impulse."
  inflect-models-db:
    source: "git+https://github.com/INFLECT-Praenora/inflect-models-db"
    ref: "152d6f5297f0026f4cb2ef215d03ff8d9613d0e8"
    mode: reference
    description: "Curated paper-extracted model database. SOURCE of models (not an engine): every model is discoverable as a composite and runs by slug via simulate(). Optional extra: models-db."

# Directory layout. New workspaces group their research directories under a
# tidy `workspace/` subtree (the dirs below); the hidden `.pbg/` machine state
# stays at the root like `.git/`. Tooling (dashboard, lint, skills) resolves
# these via the shared WorkspacePaths resolver. Any key you remove falls back
# to its flat top-level default — so you can move things back if you prefer.
layout:
  studies: workspace/studies
  investigations: workspace/investigations
  composites: workspace/composites
  references: workspace/references
  datasets: workspace/datasets
  reports: workspace/reports

# The four arrays below start empty; the dashboard populates them as you
# work. Hand-editing is fine for small adds, but the dashboard's writers
# also keep cross-references (studies, runs, viz wiring) consistent.

# Observable specs: name + store_path + index_by. Populated by the Studies
# tab when you declare a behavior_test or readout. See .pbg/schemas/study.schema.json
# (readouts section) for shape.
observables: []

# Visualization wiring (address + config). Populated by the Visualizations
# tab and /viva:viz.
visualizations: []

# Reproducible simulation specs (composite + steps + params). Populated by
# the Composites tab "Run" button and by `/viva:study run-baseline`.
simulations: []

# Workspace-scoped datasets (file path + format + provenance). Populated by
# the Inputs tab "Attach dataset" action.
datasets: []

references_bib: workspace/references/papers.bib
server:
  enabled: false
